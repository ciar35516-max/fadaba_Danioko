<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fadaba Danioko | Carte de Visite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 10px; }
    .card { background: #1e293b; max-width: 400px; width: 100%; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); padding: 32px 24px; text-align: center; border: 1px solid #334155; }
    .avatar-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 16px;
      border: 2px solid #38bdf8;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    h1 { font-size: 22px; margin-bottom: 6px; color: #ffffff; font-weight: 700; }
    p.subtitle { color: #38bdf8; font-size: 14px; font-weight: 500; margin-bottom: 24px; }
    .btn-contact { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; text-decoration: none; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); transition: transform 0.2s; }
    .btn-contact:active { transform: scale(0.98); }
    .links-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 14px; font-weight: 600; text-align: left; }
    .link-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: #e2e8f0; text-decoration: none; margin-bottom: 10px; font-size: 14px; font-weight: 500; transition: border-color 0.2s, background 0.2s; }
    .link-item:hover { border-color: #38bdf8; background: #1e293b; }
    .icon-text { display: flex; align-items: center; gap: 10px; }
  </style>
</head>
